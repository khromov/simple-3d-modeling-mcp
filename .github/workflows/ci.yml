name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled assets (fonts, BOSL2)
        run: npm run assets

      - name: Type-check (sources and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  mcpb:
    name: .mcpb bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest
        run: npx --yes @anthropic-ai/mcpb validate mcpb/manifest.json

      - name: Build bundle
        run: npm run build:mcpb

      - name: Inspect bundle
        run: npx --yes @anthropic-ai/mcpb info simple-3d-modeling.mcpb
