name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled assets (fonts, BOSL2)
        run: npm run assets

      - name: Type-check (sources and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: MCP stdio smoke test
        run: node scripts/capture-mcp-traffic.mjs "${{ runner.temp }}/mcp-traffic.json"

  test-bun:
    name: test (${{ matrix.os }}, Bun latest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # npm installs the locked dependencies and builds; Bun is the runtime under test.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled assets (fonts, BOSL2)
        run: npm run assets

      - name: Build
        run: npm run build

      # package-manifest.test.ts checks npm pack/publish output, which would run
      # npm itself under Bun; the Node jobs cover it.
      - name: Test (Bun runtime)
        run: bun --bun vitest run --exclude tests/package-manifest.test.ts

      - name: MCP stdio smoke test (server running under Bun)
        run: bun scripts/capture-mcp-traffic.mjs "${{ runner.temp }}/mcp-traffic.json"

  mcpb:
    name: .mcpb bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifest
        run: npx --yes @anthropic-ai/mcpb validate mcpb/manifest.json

      - name: Build bundle
        run: npm run build:mcpb

      - name: Inspect bundle
        run: npx --yes @anthropic-ai/mcpb info simple-3d-modeling.mcpb

      # Runs the server exactly as packed, with only its pruned production dependencies.
      - name: MCP stdio smoke test (bundled server)
        run: |
          unzip -q simple-3d-modeling.mcpb -d "$RUNNER_TEMP/bundle"
          node scripts/capture-mcp-traffic.mjs "$RUNNER_TEMP/mcpb-traffic.json" "$RUNNER_TEMP/bundle/server/dist/index.js"
